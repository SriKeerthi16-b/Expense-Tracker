<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker <span class="emoji">💸</span></h1>
            <div class="header-actions">
                <button id="exportBtn" class="icon-btn" title="Export Data"><i class="fas fa-file-export"></i></button>
                <button id="importBtn" class="icon-btn" title="Import Data"><i class="fas fa-file-import"></i></button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </header>
        
        <!-- Add Expense Form -->
        <div class="form-section card">
            <form id="expenseForm">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="0.00" required step="0.01" min="0.01">
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Housing">Housing</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Optional">
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="submitBtn">Add Expense</button>
                    <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Summary Cards -->
        <div class="summary">
            <div class="card">
                <h3>Total Spent</h3>
                <p id="totalAmount">₹0.00</p>
            </div>
            <div class="card">
                <h3>This Month</h3>
                <p id="monthlyAmount">₹0.00</p>
            </div>
            <div class="card">
                <h3>Daily Average</h3>
                <p id="dailyAverage">₹0.00</p>
            </div>
        </div>

        <!-- Budget Section -->
        <div class="card budget-section">
            <div class="section-header">
                <h2>Budget Settings</h2>
                <button id="addBudgetBtn" class="icon-btn"><i class="fas fa-plus"></i> Add Budget</button>
            </div>
            <div id="budgetList"></div>
        </div>

        <!-- Filter Controls -->
        <div class="card filter-section">
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="filterCategory">Category:</label>
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filterDateFrom">From:</label>
                    <input type="date" id="filterDateFrom">
                </div>
                
                <div class="filter-group">
                    <label for="filterDateTo">To:</label>
                    <input type="date" id="filterDateTo">
                </div>
                
                <button id="applyFiltersBtn">Apply Filters</button>
                <button id="resetFiltersBtn">Reset</button>
            </div>
        </div>

        <!-- Charts Container -->
        <div class="charts">
            <div class="chart-container card">
                <h3>Spending by Category</h3>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-container card">
                <h3>Monthly Trend</h3>
                <canvas id="monthlyTrend"></canvas>
            </div>
        </div>

        <!-- Expense List -->
        <div class="expense-list card">
            <div class="section-header">
                <h2>Expense History</h2>
                <div class="sort-controls">
                    <select id="sortBy">
                        <option value="date-desc">Date (Newest First)</option>
                        <option value="date-asc">Date (Oldest First)</option>
                        <option value="amount-desc">Amount (High to Low)</option>
                        <option value="amount-asc">Amount (Low to High)</option>
                        <option value="category">Category</option>
                    </select>
                </div>
            </div>
            <div class="expense-table">
                <div class="table-header">
                    <div>Date</div>
                    <div>Category</div>
                    <div>Description</div>
                    <div>Amount</div>
                    <div>Actions</div>
                </div>
                <div id="expenseTable"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
